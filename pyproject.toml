[project]
name = "bilicourseai"
version = "0.1.0"
description = "CLI prototype for turning Bilibili course videos into structured local study reports."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "bilibili-api-python>=17.4",
    "imageio-ffmpeg>=0.6",
    "jinja2>=3.1",
    "openai>=1.80",
    "pillow>=10.0",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
bilicourse = "bilicourseai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilicourseai"]

[tool.hatch.build.targets.wheel.force-include]
"src/bilicourseai/templates" = "bilicourseai/templates"
